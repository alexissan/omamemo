name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libasound2t64 libpulse0 fonts-dejavu-core
          omamemo_ci_root="$RUNNER_TEMP/omamemo"
          mkdir -p "$omamemo_ci_root/runtime" "$omamemo_ci_root/data" "$omamemo_ci_root/config"
          chmod 700 "$omamemo_ci_root/runtime" "$omamemo_ci_root/data" "$omamemo_ci_root/config"
          printf 'XDG_RUNTIME_DIR=%s\nXDG_DATA_HOME=%s\nXDG_CONFIG_HOME=%s\n' \
            "$omamemo_ci_root/runtime" "$omamemo_ci_root/data" "$omamemo_ci_root/config" >> "$GITHUB_ENV"

      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest
          python -m pip check

      - name: Verify media tools are available
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run backend and offscreen Qt regression tests
        run: python -m pytest tests -q -ra
